<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" role="img" aria-labelledby="title desc">
  <title id="title">JW웨딩컨벤션센터 약도</title>
  <desc id="desc">인제대역, 동김해IC, 김해시청 방향, 남해고속도로 주변에서 JW웨딩컨벤션센터로 오는 길을 안내하는 약도입니다.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#4d544a" flood-opacity=".14"/>
    </filter>
    <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#f4f1e9"/>
    </linearGradient>
    <style>
      .bg{fill:url(#paper)}
      .water{fill:#eef2ea}
      .road{fill:none;stroke:#5f675a;stroke-width:12;stroke-linecap:round;stroke-linejoin:round}
      .road-thin{fill:none;stroke:#7f8978;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
      .highway{fill:none;stroke:#2f332d;stroke-width:13;stroke-linecap:round;stroke-linejoin:round}
      .rail{fill:none;stroke:#b58e7d;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:2 16}
      .label{font-family:"Noto Sans KR","Apple SD Gothic Neo",sans-serif;fill:#4d5149;font-size:22px;font-weight:500}
      .small{font-size:17px;font-weight:400;fill:#767a70}
      .tiny{font-size:15px;font-weight:400;fill:#8a8d84}
      .direction{font-size:15px;fill:#9a7e73;font-weight:500}
      .venue{font-size:28px;font-weight:700;fill:#3d4238}
      .hall{font-size:16px;font-weight:500;fill:#7d8b74;letter-spacing:.08em}
      .station{fill:#fffaf3;stroke:#7d8b74;stroke-width:3}
      .pin{fill:#7d8b74}
      .dot{fill:#2f332d}
    </style>
  </defs>

  <rect class="bg" x="16" y="16" width="728" height="528" rx="34" filter="url(#shadow)"/>
  <path class="water" d="M78 92c88-43 163-33 232-11 107 34 167 24 250-8 57-22 106-11 142 15v92H78Z" opacity=".45"/>

  <text class="direction" x="93" y="126" text-anchor="middle">서김해IC 방면</text>
  <text class="direction" x="301" y="126" text-anchor="middle">부산가야 · 해운대 방면</text>
  <text class="direction" x="565" y="126" text-anchor="middle">대저 · 부산 방면</text>
  <path class="highway" d="M70 155H606"/>
  <path class="highway" d="M626 155h72"/>
  <path class="road-thin" d="M216 155v178"/>
  <path class="road-thin" d="M578 70v405"/>
  <circle class="dot" cx="578" cy="270" r="17"/>
  <text class="label" x="608" y="276">동김해IC</text>

  <path class="rail" d="M386 96v64"/>
  <circle class="station" cx="386" cy="155" r="10"/>
  <text class="tiny" x="386" y="95" text-anchor="middle">김해</text>
  <text class="tiny" x="386" y="116" text-anchor="middle">소방서</text>
  <text class="label" x="427" y="176" text-anchor="middle">인제대역</text>

  <path class="road" d="M83 444H704"/>
  <text class="direction" x="118" y="478" text-anchor="middle">서김해IC 방면</text>
  <text class="direction" x="643" y="478" text-anchor="middle">동래 · 구포 방면</text>
  <text class="small" x="386" y="423" text-anchor="middle">남해고속도로</text>

  <circle class="dot" cx="333" cy="350" r="10"/>
  <text class="small" x="333" y="334" text-anchor="middle">메가마트</text>

  <g transform="translate(380 254)">
    <path class="pin" d="M0-43c-32 0-58 25-58 56 0 45 58 92 58 92s58-47 58-92c0-31-26-56-58-56Z"/>
    <circle cx="0" cy="13" r="20" fill="#fffdf8"/>
    <path d="M0 34C-25 16-39 1-39-18c0-15 12-27 27-27 9 0 17 4 22 11 5-7 13-11 22-11 15 0 27 12 27 27 0 19-14 34-39 52L0 48Z" fill="#fbf4ec" opacity=".42"/>
  </g>
  <text class="hall" x="380" y="266" text-anchor="middle">WEDDING HALL</text>
  <text class="venue" x="380" y="304" text-anchor="middle">JW웨딩컨벤션센터</text>
  <text class="small" x="380" y="330" text-anchor="middle">5층 일루미아홀</text>

  <g transform="translate(76 495)">
    <rect x="0" y="0" width="608" height="40" rx="20" fill="#fffaf3" stroke="#e4ded2"/>
    <text class="tiny" x="24" y="26">경전철 인제대역 하차 후 1번 출구 이용 · 도보 1분</text>
    <text class="tiny" x="384" y="26">버스 인제대역 하차</text>
  </g>
</svg>
